<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="92 88 336 336">
  <!-- The app icon's mark without its tile: the window header draws it on the chrome, so it is the
       cord and the seated tip, cropped tight. -->
  <defs>
    <linearGradient id="mark-cord" x1="0" y1="0" x2="1" y2="1">
      <!-- A shade darker than the app icon's cord: this one is drawn straight onto the window
           chrome, which on IBM Beige is a light case, and the icon's own dark tile is not there
           to hold it up. -->
      <stop offset="0" stop-color="#c07a4a"/>
      <stop offset="1" stop-color="#a8663a"/>
    </linearGradient>
  </defs>
  <circle cx="380" cy="256" r="52" fill="none" stroke="#7a5233" stroke-width="16"/>
  <path d="M246 256 H352" fill="none" stroke="url(#mark-cord)" stroke-width="54"/>
  <path d="M120 140 L246 256 L120 372" fill="none" stroke="url(#mark-cord)" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="380" cy="256" r="30" fill="#45c8ee"/>
</svg>
