# IBM Beige (issue 0JA7): a 1990s PC — PS/2 case, Windows 95 chrome — as a light theme.
#
# Every chrome colour is sampled from the owner's reference, a beige CRT and keyboard shot on a
# white studio background (docs/qa_evidence/2026-09-18-copper-and-beige-themes/ref-beige.jpg).
# The background measures #ffffff, so the white point is neutral and the hues can be taken
# literally. The whole case is one family, hue 33-37 and saturation 12-39%:
#   lit top surface  #f0e4d4  -> bevel.light       keycaps       #8e785d  -> bevel.dark
#   deck face        #c5b296  -> background (lifted to #cdc0a8)  bezel recess  #655244  -> border_strong
#   screen glass     #817e7d, saturation 3%  -> the reason `surface` is neutral
# On a real beige machine the only unsaturated surface in the whole object is the screen, which
# is Relay's own rule — chrome may have character, the surface you read stays neutral.
#
# Windows 95 supplies the accent: the navy of its title bars and selection highlight. It is
# chrome, like Dark Copper's copper, so the destination pair is free to mean only destinations.

[theme]
name = "IBM Beige"
variant = "light"
description = "A 1990s PC: beige case, bevelled chrome, navy selection, a neutral screen."

[ui]
background = "#cdc0a8"
# The screen: 2% saturation. The terminal, the idle composer, editors and previews.
surface = "#f4efe4"
# A raised plastic face: chips, buttons, menus, the focused composer.
surface_raised = "#ded3bf"
border = "#9c8d74"
border_strong = "#655244"
text = "#1f1c16"
# Muted text is read all day (cwd, hints, the status strip), so it gets margin: 5.19:1 on the
# case beige, not the 4.59:1 the first cut had.
text_muted = "#4d463a"
accent = "#1a3070"
accent_text = "#f3f2f0"
accent_hover = "#243d85"
selection = "#1a3070"
disabled = "#8a8271"
# Re-derived for the light ground, not inverted: each keeps its hue and drops in luminance until
# it clears 4.5:1 on the darkest ground it is painted on — the case beige behind a notification
# row, not the lighter chip face. Amber has to become ochre, and it is the tightest: 4.65:1.
success = "#135427"
warning = "#684800"
error = "#931c17"
# Actions (owner, 2026-09-18). A terracotta, derived for the beige ground like the three above it:
# 4.75:1 on the case beige, and the tightest separation of any theme — dE 21.0 from the brick red
# and 21.2 from the ochre, because on paper a deep red, a deep orange and a deep ochre are close
# neighbours. That is the same order of separation this theme's greyed destination pair settled on
# (dE 20.3), and the band carries the bolt glyph and the word "Actions" besides.
action = "#803700"
# A tool pane's header band (the Switchboard and its neighbours), its own token since
# 2026-09-19: it used to be `warning`, and amber has to mean one thing — something is waiting on
# you. The dark bronze from [board] below. Brass does not survive a light ground, so the band's metal
# is oxidised rather than inverted, exactly as the board's is. 4.65:1 on the case beige.
tool = "#63492b"
# The destinations. The owner's first call here was a greyed pair — "terminal is dark gray-blue
# and agent is dark gray-violet", a slate and a pewter so they sat with the plastic — and it did
# not survive use: "too dark and desaturated, I can't tell them apart from each other or from
# regular dark text" (owner, 2026-09-18). The measurements agreed. The slate was CIELAB chroma
# 13.3, barely more than the warm grey of `text_muted`, and the pair was only dE 20.3 apart and
# dE 27 and 33 from the near-black text, which is what the eye was being asked to do.
#
# The case beige is the tight ground here, so the pair is pinned at L 33 whatever its hue; the
# only free variable is chroma, and the greys were spending almost none of it. A first pass at
# chroma 31.5 and 82.6 was still "a little hard to pick out" (owner), and the reason was the
# blue: a teal-blue cannot pass chroma 35 at this lightness, so it was buying legibility with
# hue it did not have to spend. Turning it to HSV 209 — which is where a 1990s machine's own
# blue was, EGA #0000aa — doubles it to 60.1 at the same L 33, and the purple goes to 99.8.
#
# That is the ceiling: both sit at 4.6:1 on the case, and one step more chroma at either hue
# fails AA. They are dE 52 apart, dE 68 and 106 from the near-black text, dE 68 and 106 from the
# muted text they used to be mistaken for, and dE 21 and 64 from the Windows 95 navy, which
# stays the chrome. The shell blue is dE 12 from the terminal's own ANSI 4 — they are cousins on
# purpose, one is chip chrome and one is grid content, and they are never read against each
# other. If this pair still has to work harder, the next lever is a tinted chip behind it
# (`@shellSoft` / `@agentSoft` already exist in src/Theme.cpp), not more chroma.
# "You can open this" (owner, 2026-09-19: "dark green, like Warp"). A dark pine: dE 26 from the
# success green, 29 from ANSI 2, 5.5:1 on the case beige, the darkest ground it is read on.
link = "#1e4a44"
shell = "#0049a9"
agent = "#7500c3"

[syntax]
# Checked against surface (idle composer) and surface_raised (focused composer, beige): the
# focused one is the tight ground in this theme.
command = "#0049a9"
unknown = "#931c17"
flag = "#684800"
string = "#135427"
path = "#1e4a44"
operator = "#5a554a"
variable = "#7500c3"
agent = "#7500c3"
token = "#0049a9"

[terminal]
# The grid is warm paper, not a white block (owner, 2026-09-18), and the paper is lit rather than
# printed flat: it fades from a lit top edge to a shaded bottom one, the way a page on a desk does.
# The colour the owner approved, #f4efe4, is now the middle of that fade. Both ends carry the
# theme's contrast promise on their own — worst ANSI entry 5.06:1 at the top, 4.55:1 at the bottom,
# which is the floor: one step further (#ece4d4) lands at 4.39:1 and fails AA.
background = "#f8f4ec"
background_end = "#efe8da"
foreground = "#1f1c16"
cursor = "#23211a"
background_intense = "#ffffff"
foreground_intense = "#14120d"
# The ramp inverts on a light ground: ANSI 7 and 15 are the darkest entries, and "bright" means
# more contrast, not more light, or \e[37m text vanishes on the page.
palette = [
  "#23211a", "#a8201a", "#18602f", "#7a5400", "#0a52a1", "#7a2f8f", "#0f5f5a", "#4a4638",
  "#6e6858", "#8a140f", "#12522a", "#5e4200", "#06408a", "#5f2270", "#0a4a46", "#14120d",
]

[bevel]
# Two-tone moulded edges instead of 1px hairlines: a hairline on paper reads as a stray mark.
# Honoured by src/Theme.cpp when [flags] bevel is true; ignored by any other reader.
light = "#f0e4d4"
dark = "#8e785d"

[board]
# The switchboard materials (docs/SWITCHBOARD-AESTHETIC.md 3.4), painted since 2026-09-19. Brass
# does not survive a light ground (#c8a45c is 2.35:1 on white), so it is oxidised rather than
# inverted: phenolic cream face, dark bronze metal at 5.77:1 on it, and an unlit bronze for the
# hardware that is not under the pointer.
face = "#e0d6bd"
metal = "#63492b"
metal_dim = "#8a7550"

[material]
# Moulded ABS, the material a 1990s case is actually made of (owner, 2026-09-18: "make ibm beige
# look like computer plastic"). Plastic is the opposite of this theme's metal cousin in the two
# ways that matter: the highlight is broad rather than a specular line, because the surface
# scatters light instead of reflecting it, and the range is narrow, because a beige case in a lit
# room is nearly one colour — what you see is the moulding, not a shine. `mid` is the #ded3bf the
# flat version used, so a chip still averages to the colour the palette was measured on.
light = "#e4dac6"
mid = "#ded3bf"
dark = "#d6cbb4"
# The soft inner light a moulded face catches under the pointer. Not a specular line: on plastic
# there is no such thing.
edge = "#efe7d8"
# The case itself, the largest moulded surface here. It stops at the #cdc0a8 the palette was
# measured on, because one step further (#c6b89e) puts ochre at 4.27:1 and fails AA.
chrome_light = "#d6cbb4"
chrome_dark = "#cdc0a8"

[flags]
# Windows 95 had no rounded corners and drew every control with a bevel.
bevel = true
square = true
board_material = true
plastic = true
