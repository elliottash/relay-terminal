# Dark Copper (issue 0JA7): charcoal ground, aged copper in the chrome.
#
# The owner's "rusty metal, but more charcoal than oxide", taken from their reference: a 1950s
# operator headset on a manual switchboard (docs/qa_evidence/2026-09-18-copper-and-beige-themes/
# ref-switchboard.jpg). Once the tungsten white point is discounted, the board metal is copper
# (hue 0-16, dim), not brass, and the one cool metal in the scene is the operator's nickel
# headband. So: a cool charcoal ground, copper for the chrome, nickel for the focus ring.
#
# THE TRAP, and how this file avoids it. Copper sits between amber (warning) and red (error) on
# the colour wheel. The theme keeps them apart two ways, both measured by the evidence script:
#   * the structural copper (border, surface_raised) is dim: 1.37:1 and 1.62:1 against the
#     ground, where warning is 11.10:1 and error 6.00:1. A rule can never read as a lit flag;
#   * the one bright copper, the accent, is CIELAB dE 28.5 from warning and 31.2 from error.
# warning and error are Relay Dark's, unchanged: the meaning colours do not move per theme.
#
# The destination pair (shell cyan, agent violet) stays the destination pair. It is no longer
# also the accent: here the accent is copper, so the focus ring, the selected tab and the primary
# button are chrome, and cyan/violet only ever mean "where this line goes".

[theme]
name = "Dark Copper"
variant = "dark"
description = "Charcoal ground, aged copper chrome, a nickel focus ring; switchboard, not rust."

[ui]
background = "#0e0f12"
# The text surface stays cool and near-neutral: syntax colour sits on it.
surface = "#15161a"
# Copper-tinted: chips, menus, the pane header, the focused composer.
surface_raised = "#241c18"
border = "#3a2822"
# Nickel, from the headband: the only cool metal in the theme, so the focused pane's outline
# has a hue that appears nowhere else. 3.76:1 on the ground (WCAG 1.4.11 wants 3:1).
border_strong = "#666f7a"
text = "#ece6e0"
text_muted = "#a2968c"
accent = "#c07a4a"
accent_text = "#1a0f08"
accent_hover = "#d08a58"
selection = "#5a3a26"
disabled = "#6b625b"
success = "#7ec88c"
warning = "#e5c07b"
error = "#e06c75"
# Actions (owner, 2026-09-18). The one theme where a red-orange has a third colour to stay clear
# of: the copper accent is itself an orange. A vermilion — redder in hue and half again as
# saturated — keeps dE 27.1 from the copper, 36.6 from the red and 47.0 from the amber.
action = "#e56a30"
# A tool pane's header band (the Switchboard and its neighbours), its own token since
# 2026-09-19: it used to be `warning`, and amber has to mean one thing — something is waiting on
# you. The switchboard metal from [board] below — this theme's brass is copper, straight off the
# reference. dE 23.7 from the amber, which is what keeps a band clear of a flag.
tool = "#c08556"
# "You can open this" (owner, 2026-09-19: "dark green, like Warp"). As dark a green as 4.5:1
# allows on the lit top of a metal face (4.97:1); dE 22 from the success green and 23 from ANSI 2,
# so "open" and "done" stay two colours. The composer's `path` below is the same colour.
link = "#1aa85e"
shell = "#45c8ee"
# About 8 degrees bluer than Relay Dark's #b48ef7: on a copper-chromed ground the eye adapts
# warm and a red-leaning violet drifts toward brown. Moving it away from red keeps it clear of
# both the chrome and the error colour, and it gains contrast (7.76:1 against 7.44:1).
agent = "#ab97f7"

[syntax]
command = "#45c8ee"
unknown = "#f07178"
flag = "#e5c07b"
string = "#7ec88c"
path = "#1aa85e"
operator = "#9a938a"
variable = "#ab97f7"
agent = "#ab97f7"
token = "#45c8ee"

[terminal]
# The grid stays plain: no copper reaches it (docs/SWITCHBOARD-AESTHETIC.md 2.2). It is shaded,
# not tinted — a neutral fade from a lit top edge down into the dark, centred on the #0e0f12 the
# flat version used. Contrast holds at both ends (worst readable entry 6.7:1 at the top).
background = "#12131a"
background_end = "#0a0b0e"
foreground = "#dad4ce"
cursor = "#f4efe9"
background_intense = "#15161a"
foreground_intense = "#f4efe9"
palette = [
  "#1f1815", "#f2777a", "#7dd399", "#ecc476", "#61afef", "#c09ae9", "#56c8d8", "#cbc3bb",
  "#6e645c", "#ff8c8f", "#98e5b0", "#f8d58e", "#81c4ff", "#d2b0f5", "#78ddea", "#f4efe9",
]

[board]
# The switchboard materials (docs/SWITCHBOARD-AESTHETIC.md 3.4), painted since 2026-09-19: `face`
# is the ground of the Switchboard pane, `metal` a lit piece of its hardware and `metal_dim` the
# same hardware unlit. Brass becomes copper here, straight off the reference: 5.91:1 metal on face,
# legible as enamel text. This is the one theme whose chrome and board are the same material, so
# check the board widgets against it first.
face = "#1a1210"
metal = "#c08556"
metal_dim = "#6b4a33"

[material]
# Copper is a metal, and a flat fill of it is brown paint (owner, 2026-09-18: "there's no way to
# make the copper look metallic?"). A metal face is a gradient with one specular line: light
# falls on the top edge, the face falls away into shade, and a press turns that round. `mid` is
# the #241c18 the flat version used, so a chip still averages to the colour the palette was
# measured on, and both ends carry the contrast contract (worst pair 4.79:1 at the lit top).
light = "#2d231e"
mid = "#241c18"
dark = "#1b1512"
# The specular line along a raised top edge: lit copper, the brightest copper in the theme after
# the accent, and structural rather than a flag (1.9:1 on the ground, where warning is 11:1).
edge = "#6d5241"
# The sheet the panes sit on: a shallower sheen than a chip, so the chips read as raised out of
# it. Cool, like the ground — the chrome is copper, the chassis is charcoal.
chrome_light = "#15171c"
chrome_dark = "#0b0c0f"

[flags]
board_material = true
metal = true
