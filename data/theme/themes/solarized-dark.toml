# Solarized Dark (Ethan Schoonover's palette, https://ethanschoonover.com/solarized/).
# The ANSI palette is Solarized's own mapping; the UI tokens are Relay's chrome drawn in base03.

[theme]
name = "Solarized Dark"
variant = "dark"
description = "Ethan Schoonover's Solarized, dark background, cyan accent."

[ui]
# Every text token here clears 4.5:1 on background, surface and surface_raised (docs/ARCHITECTURE.md,
# "Legible text"; tests/theme_test.cpp). Solarized's own base0/base01 and accents do not reach that on base02, so the text, muted and
# state tokens are lighter tints of the same hues, and surface_raised is a step closer to base02. Some values were lifted for that on 2026-09-18.
background = "#002b36"
surface = "#073642"
surface_raised = "#093e4b"
border = "#144e5c"
border_strong = "#586e75"
text = "#c3cccc"
text_muted = "#94a6ad"
accent = "#2fb5ab"
accent_text = "#002b36"
accent_hover = "#3fb9af"
selection = "#11555a"
disabled = "#48626a"
success = "#97ad00"
warning = "#cf9c00"
error = "#eb8886"
shell = "#2fb5ab"
agent = "#9b9fd7"

[syntax]
command = "#2fb5ab"
unknown = "#eb8886"
flag = "#cf9c00"
string = "#97ad00"
path = "#5eabe2"
operator = "#94a6ad"
variable = "#9b9fd7"
agent = "#9b9fd7"
token = "#2fb5ab"

[terminal]
background = "#002b36"
foreground = "#839496"
cursor = "#93a1a1"
background_intense = "#073642"
foreground_intense = "#fdf6e3"
palette = [
  "#073642", "#dc322f", "#859900", "#b58900", "#268bd2", "#d33682", "#2aa198", "#eee8d5",
  "#002b36", "#cb4b16", "#586e75", "#657b83", "#839496", "#6c71c4", "#93a1a1", "#fdf6e3",
]
