# Relay Light (issue 0JA7): the same layout on paper instead of ink.
#
# Every token the dark theme sets is set here too, including the semantic ones, because a light
# surface needs darker greens, yellows and reds to stay readable.

[theme]
name = "Relay Light"
variant = "light"
description = "Paper chrome, a saturated cyan accent; the same shapes as Relay Dark."

[ui]
# Every text token here clears 4.5:1 on background, surface and surface_raised (docs/ARCHITECTURE.md,
# "Legible text"; tests/theme_test.cpp). Some values were lifted for that on 2026-09-18.
background = "#fbfbfd"
surface = "#f2f3f7"
surface_raised = "#e8eaf0"
border = "#d3d7e0"
# The focused pane's outline: darker than the resting border, still not the accent.
border_strong = "#98a0b0"
text = "#1a1d24"
text_muted = "#5c6472"
# Cyan on paper cannot be both light and legible: at 4.5:1 on the chip face a teal tops out
# around CIELAB chroma 30, which is why the first cut (#097193) read as a slate, not a colour.
# Turning the hue a few degrees bluer (HSV 204 rather than 195) buys chroma 45 at the same
# lightness, so the accent and the shell destination stay recognisably cyan instead of grey.
accent = "#006ab1"
accent_text = "#ffffff"
# The hover of a primary button only changes the fill; the label stays `accent_text` white
# (src/Theme.cpp, `QPushButton:default:hover`). #008cd6 put that white at 3.67:1, so the one
# state a button spends its click in was the one that failed AA. Same hue, one step darker.
accent_hover = "#0074bd"
selection = "#005c99"
disabled = "#a8aebb"
success = "#1e763b"
warning = "#8a5d00"
error = "#c0273a"
# Actions (owner, 2026-09-18). A burnt orange deep enough for paper: 4.96:1 on the darkest ground
# it is painted on, dE 29.9 from the red and 26.6 from the ochre warning.
action = "#a8450c"
# A tool pane's header band (the Board and its neighbours), its own token since
# 2026-09-19: it used to be `warning`, and amber has to mean one thing — something is waiting on
# you. Bronze for the page: the brass darkened until it reads as metal on paper rather than as a
# highlighter. 8.08:1 on the lightest ground, dE 28.4 from this theme's amber.
tool = "#5a3f1a"
# The two destinations, matched in lightness (CIELAB L 43.5 and 43.4) so neither reads as the
# louder one, and pushed to the chroma each hue allows at 4.5:1 on the chip face: 44.8 and 102.3,
# up from 29.3 and 82.2. They are dE 72 apart and dE 51 / 103 from the near-black text, which is
# what the owner could not see before.
# "You can open this" (owner, 2026-09-19: "dark green, like Warp"). The success green here is
# already dark, so the link is a darker pine, bluer by 40 degrees: dE 31 from success, 28 from
# ANSI 2, 7.2:1 on the raised face. The composer's `path` below is the same colour.
link = "#1a5548"
shell = "#006ab1"
agent = "#7c3aed"

[syntax]
command = "#006ab1"
unknown = "#c0273a"
flag = "#8a5d00"
string = "#1e763b"
path = "#1a5548"
operator = "#616977"
variable = "#7c3aed"
agent = "#7c3aed"
token = "#006ab1"

[terminal]
background = "#fbfbfd"
foreground = "#24292f"
cursor = "#0084d1"
background_intense = "#ffffff"
foreground_intense = "#0b0d10"
# On a light surface the "bright" half is darker, not lighter, or bold text disappears.
palette = [
  "#3b414b", "#cf222e", "#116329", "#7d4e00", "#0550ae", "#8250df", "#137b7f", "#6e7781",
  "#24292f", "#a40e26", "#0e6027", "#633c01", "#0349b4", "#6639ba", "#0f5d61", "#1f2328",
]

[board]
# The Board's materials (docs/SWITCHBOARD-AESTHETIC.md 3.3, 3.4). Brass does not survive a
# light ground — #c8a45c is 2.35:1 on white — so the metal is oxidised rather than inverted: this
# theme's own bronze, the one its tool bands already wear, at 8.24:1 on the face. The face is a
# phenolic cream a step deeper than the paper background, so the board reads as a sheet laid on the
# page rather than as the page; every text token still clears 4.5:1 on it (tightest: success, 4.80).
face = "#f0ece3"
metal = "#5a3f1a"
metal_dim = "#a5967e"

[flags]
# See relay-dark.toml: `false` paints the board in hairlines instead.
board_material = true
