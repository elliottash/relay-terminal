# Gruvbox Dark (Pavel Pertsev's palette, https://github.com/morhetz/gruvbox).
# Retro warm greys; the accent is gruvbox's bright blue so it stays legible on bg0.

[theme]
name = "Gruvbox Dark"
variant = "dark"
description = "Pavel Pertsev's gruvbox: warm dark greys, muted primaries."

[ui]
# Every text token here clears 4.5:1 on background, surface and surface_raised (docs/ARCHITECTURE.md,
# "Legible text"; tests/theme_test.cpp). Some values were lifted for that on 2026-09-18.
background = "#282828"
surface = "#32302f"
surface_raised = "#3c3836"
border = "#504945"
border_strong = "#7c6f64"
text = "#ebdbb2"
text_muted = "#afa28e"
accent = "#8cab9f"
accent_text = "#1d2021"
accent_hover = "#9cb8ac"
selection = "#45403d"
disabled = "#6d6259"
success = "#b8bb26"
warning = "#fabd2f"
error = "#fc7f70"
shell = "#8cab9f"
agent = "#d791a4"

[syntax]
command = "#8cab9f"
unknown = "#fc7f70"
flag = "#fabd2f"
string = "#b8bb26"
path = "#8ec07c"
operator = "#ada296"
variable = "#d791a4"
agent = "#d791a4"
token = "#8cab9f"

[terminal]
background = "#282828"
foreground = "#ebdbb2"
cursor = "#ebdbb2"
background_intense = "#3c3836"
foreground_intense = "#fbf1c7"
palette = [
  "#282828", "#cc241d", "#98971a", "#d79921", "#458588", "#b16286", "#689d6a", "#a89984",
  "#928374", "#fb4934", "#b8bb26", "#fabd2f", "#83a598", "#d3869b", "#8ec07c", "#ebdbb2",
]
