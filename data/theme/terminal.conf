# Relay's terminal appearance defaults, read by the engine at startup (src/EngineBackend.cpp).
# Colour is not here: data/theme/themes/<id>.toml is the only source of truth for colour.
#
# This was Relay's Konsole profile until KonsolePart was retired (2026-09-18); the keys keep
# their old names and INI groups so an existing file still reads.
[Appearance]
Font=Hack,11,-1,5,50,0,0,0,0,0
TerminalMargin=16
LineSpacing=0

[Cursor Options]
CursorShape=1
ShowUnfocusedCursor=false

[General]
TerminalColumns=100
TerminalRows=30

[Scrolling]
HistorySize=20000

[Terminal Features]
BlinkingCursorEnabled=true
