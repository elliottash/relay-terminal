      <stop offset="0" stop-color="var(--tile-top)"/><stop offset="1" stop-color="var(--tile-bottom)"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#h-tile)"/>
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="var(--edge)" stroke-width="4"/>
  <path d="M112 256 C112 150 344 160 344 148" fill="none" stroke="var(--cord)" stroke-width="40" stroke-linecap="round"/>
  <path d="M112 256 C112 362 344 352 344 364" fill="none" stroke="var(--dim)" stroke-width="40" stroke-linecap="round"/>
  <circle cx="112" cy="256" r="44" fill="var(--metal)"/>
