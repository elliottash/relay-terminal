<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- D: the machine itself. A moulded bezel, a warm screen, one caret. -->
  <defs>
    <linearGradient id="d-case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--case-top)"/><stop offset="1" stop-color="var(--case-bottom)"/>
    </linearGradient>
    <linearGradient id="d-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--grid-top)"/><stop offset="1" stop-color="var(--grid-bottom)"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#d-case)"/>
  <path d="M56 16 H456 A40 40 0 0 1 496 56 V70 H16 V56 A40 40 0 0 1 56 16 Z" fill="var(--bevel-light)"/>
  <rect x="16" y="446" width="480" height="50" fill="var(--bevel-dark)" fill-opacity="0.55"/>
  <rect x="18" y="18" width="476" height="476" rx="38" fill="none" stroke="var(--edge)" stroke-width="4"/>
  <!-- recessed screen -->
  <rect x="86" y="96" width="340" height="252" rx="18" fill="var(--bevel-dark)"/>
  <rect x="94" y="104" width="324" height="236" rx="14" fill="url(#d-screen)"/>
  <!-- the prompt: a chevron and a block caret -->
  <path d="M146 176 L186 212 L146 248" fill="none" stroke="var(--shell)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="176" width="34" height="76" rx="4" fill="var(--agent)"/>
  <!-- vents on the case chin -->
  <g fill="var(--bevel-dark)" fill-opacity="0.5">
    <rect x="150" y="392" width="212" height="12" rx="6"/>
    <rect x="150" y="416" width="212" height="12" rx="6"/>
  </g>
</svg>
