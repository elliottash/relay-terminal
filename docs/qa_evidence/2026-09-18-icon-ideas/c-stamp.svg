<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- C: today's chevron, struck into a metal plate instead of glowing. -->
  <defs>
    <linearGradient id="c-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--plate-top)"/><stop offset="0.55" stop-color="var(--plate-mid)"/>
      <stop offset="1" stop-color="var(--plate-bottom)"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#c-plate)"/>
  <path d="M112 16 H400 A96 96 0 0 1 496 112 V128 H16 V112 A96 96 0 0 1 112 16 Z" fill="var(--specular)" fill-opacity="0.5"/>
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="var(--edge)" stroke-width="4"/>
  <!-- the groove: a dark stamp with a lit lower lip -->
  <g fill="none" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 168 L256 264 L160 360" stroke="var(--groove)"/>
    <path d="M160 176 L256 272 L160 368" stroke="var(--specular)" stroke-opacity="0.35"/>
  </g>
  <circle cx="356" cy="264" r="30" fill="var(--groove)"/>
  <circle cx="356" cy="272" r="30" fill="var(--specular)" fill-opacity="0.3"/>
</svg>
