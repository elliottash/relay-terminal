<!-- The app icon, so the web client on a phone or tablet wears the same mark as the desktop app
     (owner, 2026-09-18: "i want this icon everywhere"). Kept in step with
     data/icons/org.relayterminal.Relay.svg by hand: app/ ships on its own to the browser and
     cannot reach the desktop data directory. -->
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512">
  <!-- The prompt drawn as a patch cord: the chevron Relay has always used is a line, and the line
       ends in a plug seated in a jack. Colours are Dark Copper's (data/theme/themes/dark-copper.toml):
       the chassis, the board's copper, and the shell's cyan at the tip, because a lit tip is the
       destination the line is patched to. -->
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1210"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="cord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d79a68"/>
      <stop offset="1" stop-color="#c08556"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#chassis)"/>
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="#3a2822" stroke-width="4"/>
  <!-- the jack the line is patched into -->
  <circle cx="380" cy="256" r="58" fill="#6b4a33"/>
  <circle cx="380" cy="256" r="26" fill="#0b0c0f"/>
  <!-- the cord, bent into the prompt, and its run to the jack -->
  <path d="M246 256 H352" fill="none" stroke="url(#cord)" stroke-width="54"/>
  <path d="M120 140 L246 256 L120 372" fill="none" stroke="url(#cord)" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the plug tip, lit in the destination's colour -->
  <circle cx="380" cy="256" r="30" fill="#45c8ee"/>
</svg>
