<!DOCTYPE html>

<!-- The pane view (app/pane.js) against fixture states, for development, screenshots and
     tests/test_pane_view.py. Not part of the app: nothing links here.
     Serve the repository root so the fixtures are reachable:
       python3 -m http.server -d /path/to/relay-terminal 8000
       open http://127.0.0.1:8000/app/pane-demo.html?fixture=busy_queue
     Served from app/ alone (remote/httpd.py, or http.server in app/) the fixture files are out of
     reach; "Load JSON…" opens one from disk instead. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relay pane view</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./pane-theme.css">
<link rel="stylesheet" href="./pane.css">
<link rel="stylesheet" href="./pane-demo.css">
<script type="module" src="./pane-demo.js"></script>
</head>
<body>
<header id="demo-bar">
  <label>Fixture <select id="demo-fixture"></select></label>
  <label>Input <select id="demo-input">
    <option value="">auto</option><option value="mouse">mouse</option><option value="touch">touch</option>
  </select></label>
  <label>Theme <select id="demo-theme">
    <option value="relay-dark">Relay Dark</option><option value="relay-light">Relay Light</option>
  </select></label>
  <label class="demo-file">Load JSON… <input type="file" id="demo-file" accept="application/json,.json"></label>
  <button type="button" id="demo-log-toggle">Sent: 0</button>
</header>
<p id="demo-note" hidden></p>
<main id="demo-stage"></main>
<pre id="demo-log" hidden></pre>
</body>
</html>
