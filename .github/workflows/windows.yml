name: Native Windows
on:
  workflow_dispatch:
  push:
    paths: ['engine/pty/PtyWin.cpp', 'engine/pty/Pty.h', 'packaging/windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  conpty:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:/Qt
          'C:/Qt/6.8.3/msvc2022_64/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native pseudoconsole test
        run: cmake -S packaging/windows -B build-windows -A x64 -DCMAKE_PREFIX_PATH=C:/Qt/6.8.3/msvc2022_64
      - run: cmake --build build-windows --config Release --parallel
      - name: Exercise native Windows process and console lifecycle
        run: ctest --test-dir build-windows -C Release --output-on-failure
