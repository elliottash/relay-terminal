# SPDX-License-Identifier: AGPL-3.0-or-later
name: Native Windows
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""
  push:
    paths: ['engine/**', 'src/**', 'backend/**', 'shell/**', 'CMakeLists.txt', 'cmake/**', 'packaging/windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography
      - name: Native storage, worker, credentials and PowerShell tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PYTHONPATH = 'backend'
          $env:RELAY_POWERSHELL = (Get-Command pwsh).Source
          python -m unittest discover -s tests -p test_platform_storage.py -v
          python -m unittest discover -s tests -p test_powershell.py -v
          python -m unittest discover -s tests -p test_windows_open.py -v
          python -m unittest discover -s tests -p test_tryit_windows.py -v
  conpty:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall cryptography
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:/Qt
          'C:/Qt/6.8.3/msvc2022_64/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native pseudoconsole test
        run: cmake -S packaging/windows -B build-windows -A x64 -DCMAKE_PREFIX_PATH=C:/Qt/6.8.3/msvc2022_64
      - run: cmake --build build-windows --config Release --parallel
      - name: Exercise native Windows process and console lifecycle
        run: ctest --test-dir build-windows -C Release --output-on-failure
      - name: Configure compiler cache
        # #V52P. A Visual Studio generator ignores CMAKE_CXX_COMPILER_LAUNCHER, so this is
        # ccache's MSBuild recipe: ccache.exe copied as cl.exe, named through CMAKE_VS_GLOBALS.
        # When the download fails the build runs uncached rather than not at all.
        id: ccache
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'relay-ccache'
          "CCACHE_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CCACHE_MAXSIZE=500M" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CCACHE_COMPRESS=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CCACHE_BASEDIR=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $v = '4.10.2'
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          try {
            Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$v/ccache-$v-windows-x86_64.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
            $exe = Join-Path $env:RUNNER_TEMP "ccache-$v-windows-x86_64/ccache.exe"
            $tool = Join-Path $env:RUNNER_TEMP 'ccache-cl'
            New-Item -ItemType Directory -Force $tool | Out-Null
            Copy-Item $exe (Join-Path $tool 'cl.exe')
            Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $tool = $tool -replace '\\', '/'
            "globals=-DCMAKE_VS_GLOBALS=CLToolExe=cl.exe;CLToolPath=$tool;TrackFileAccess=false;UseMultiToolTask=true;DebugInformationFormat=OldStyle" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } catch {
            Write-Warning "ccache download failed, building uncached: $_"
          }
      - name: Restore compiler objects
        id: compiler-cache
        if: ${{ steps.ccache.outputs.globals != '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/relay-ccache
          key: ccache-windows2022-msvc-qt6.8.3-v1-${{ hashFiles('src/**', 'engine/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: ccache-windows2022-msvc-qt6.8.3-v1-
      - name: Configure Windows desktop
        id: configure
        if: ${{ !cancelled() }}
        shell: pwsh
        run: cmake -S . -B build-app -A x64 -DRELAY_QT_MAJOR=6 -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH=C:/Qt/6.8.3/msvc2022_64 -DRELAY_COMPILER_CACHE=OFF "${{ steps.ccache.outputs.globals }}"
      - name: Build Windows desktop
        id: desktop
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: cmake --build build-app --config Release --parallel 4
      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outputs.globals != '' }}
        run: ccache --show-stats
      - name: Save compiler objects
        if: ${{ !cancelled() && steps.desktop.outcome == 'success' && steps.ccache.outputs.globals != '' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/relay-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Package native installer with private runtimes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        id: package
        if: ${{ !cancelled() && steps.desktop.outcome == 'success' }}
        shell: pwsh
        run: |
          $version = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } elseif ($env:GITHUB_REF_NAME -match '^v[0-9]') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.1.0-beta.3' }
          ./packaging/windows/package.ps1 -Version $version
      - name: Install and launch as a user
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = (Get-ChildItem dist/*setup.exe).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'Relay installed'
          $install = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          python packaging/windows/installed-smoke.py "$destination" windows-evidence
          $uninstall = Start-Process "$destination/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-evidence
          path: windows-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*setup.exe
          if-no-files-found: error
