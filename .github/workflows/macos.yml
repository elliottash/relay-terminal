# SPDX-License-Identifier: AGPL-3.0-or-later
name: Native macOS
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
        default: '0.1.0-beta.3'
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: '0.1.0-beta.3'
  push:
    paths: ['engine/**', 'src/**', 'backend/**', 'shell/**', 'CMakeLists.txt', 'packaging/macos/**', '.github/workflows/macos.yml']
permissions:
  contents: read
jobs:
  native:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            cmake_arch: arm64
          - runner: macos-15-intel
            arch: x64
            cmake_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore pinned Qt
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/Qt/6.8.3
          key: qt-6.8.3-macos-${{ matrix.arch }}-clang64-v1
      - name: Install test dependencies
        run: python -m pip install aqtinstall cryptography
      - name: Install pinned Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m aqt install-qt mac desktop 6.8.3 clang_64 -O "$RUNNER_TEMP/Qt"
      - name: Save installed Qt before testing
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/Qt/6.8.3
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}
      - name: Expose Qt tools
        run: echo "$RUNNER_TEMP/Qt/6.8.3/macos/bin" >> "$GITHUB_PATH"
      - name: Configure compiler cache
        id: compiler-key
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/relay-ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          if ! command -v ccache >/dev/null; then brew install ccache; fi
          ccache --set-config=max_size=400M
          ccache --set-config=compression=true
          compiler=$(xcrun clang --version | shasum -a 256 | cut -c1-16)
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "prefix=ccache-macos-${{ matrix.arch }}-qt6.8.3-min13-sdk${sdk}-clang${compiler}-v1" >> "$GITHUB_OUTPUT"
      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-key.outputs.prefix }}-${{ hashFiles('src/**', 'engine/**', 'CMakeLists.txt', 'packaging/macos/*.cmake') }}
          restore-keys: ${{ steps.compiler-key.outputs.prefix }}-
      - name: Native Python storage, Keychain and worker
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p test_macos_runtime.py -v
          python -m unittest discover -s tests -p test_macos_tryit.py -v
          python -m unittest discover -s tests -p test_macos_prompts.py -v
          python -m unittest discover -s tests -p test_platform_storage.py -v
          python -m unittest discover -s tests -p test_worker_encoding.py -v
      - name: Native process, crash and runtime-directory tests
        if: ${{ !cancelled() }}
        run: |
          cmake -S packaging/macos -B build-macos-platform -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.8.3/macos" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-macos-platform --parallel 3
          ctest --test-dir build-macos-platform --output-on-failure
      - name: Configure native desktop and PTY tests
        id: configure
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B build-macos -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.8.3/macos" \
            -DRELAY_QT_MAJOR=6 -DBUILD_TESTING=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build desktop and terminal tests
        id: desktop
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: cmake --build build-macos --target relay relay-engine-tests --parallel 3
      - name: Report compiler cache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: ccache --show-stats
      - name: Save compiler objects before packaging
        if: ${{ !cancelled() && steps.configure.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Exercise native PTY lifecycle
        if: ${{ !cancelled() && steps.desktop.outcome == 'success' }}
        env:
          RELAY_ENGINE_TEST: PtyTest
          QT_QPA_PLATFORM: offscreen
        run: build-macos/engine/relay-engine-tests
      - name: Bundle private runtimes and create DMG
        id: package
        if: ${{ !cancelled() && steps.desktop.outcome == 'success' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version=${RELEASE_VERSION:-0.1.0-beta.3}
          /bin/bash packaging/macos/package.sh "$version"
      - name: Mount, install and run the native application
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python packaging/macos/installed-smoke.py dist/*_macos_${{ matrix.arch }}.dmg macos-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.arch }}-evidence
          path: macos-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-installer
          path: dist/*_macos_${{ matrix.arch }}.dmg
          if-no-files-found: error
