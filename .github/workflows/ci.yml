# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu-qt5:
    name: Build and test (Ubuntu 24.04, Qt5)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential cmake ninja-build \
            python3 python3-cryptography bash qtbase5-dev libkf5syntaxhighlighting-dev qtpdf5-dev \
            appstream desktop-file-utils ccache
      - name: Configure compiler cache
        # The same ccache the desktop uses (#V52P); CI keeps its own dir and a smaller cap.
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/relay-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/relay-ccache
          key: ccache-ubuntu24.04-qt5-gcc-v1-${{ hashFiles('src/**', 'engine/**', 'tests/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: ccache-ubuntu24.04-qt5-gcc-v1-
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRELAY_QT_MAJOR=5 -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --parallel
      - name: Report compiler cache
        if: ${{ !cancelled() }}
        run: ccache --show-stats
      - name: Save compiler objects
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/relay-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install layout
        run: |
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          find stage -type f | sort
          test -x stage/usr/bin/relay
          test -f stage/usr/share/relay/backend/worker.py
          test -x stage/usr/share/relay/scripts/relay-open
      - name: Validate desktop and AppStream metadata
        run: |
          desktop-file-validate org.relayterminal.Relay.desktop
          appstreamcli validate --no-net packaging/org.relayterminal.Relay.metainfo.xml

  qt6:
    # Two Qt6 lines, because they differ: Debian 13 has Qt 6.8 and Ubuntu 26.04 has Qt 6.10, which
    # drops overloads 6.8 still takes. tests/wordwrap_test.cpp stopped compiling on 6.10 only, and
    # nothing here noticed until a build on a 26.04 laptop did (#PF4K, d2923c9b).
    name: Build and test (${{ matrix.name }}, Qt6/KF6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'debian:trixie', name: 'Debian 13'}
          - {image: 'ubuntu:26.04', name: 'Ubuntu 26.04'}
    steps:
      - uses: actions/checkout@v5
      - name: Cache the pinned Zig and the libghostty-vt build
        # Same cache as release.yml: build-deb.sh builds the libghostty-vt core into the .deb.
        uses: actions/cache@v4
        with:
          path: cache
          key: ghostty-vt-${{ matrix.image }}-amd64-${{ hashFiles('engine/scripts/zig.sha256', 'engine/scripts/build-libghostty-vt.sh') }}
      - name: Build, test and package in a ${{ matrix.image }} container
        run: |
          mkdir -p cache
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/out:/out" -v "$PWD/cache:/cache" \
            -e RELAY_CACHE_DIR=/cache ${{ matrix.image }} \
            bash /src/packaging/deb/build-deb.sh /src /out
          ls -l out
