# Switchboard configuration. Format: docs/SWITCHBOARD-FORMAT.md
version: 1
tabs: [{id: features, folder: features}, {id: bugs, folder: changes}, {id: design, folder: design}, {id: marketing, folder: marketing}, {id: planning, folder: planning}, {id: deferred, filter: 'status:deferred'}, {id: done, filter: 'status:done,dropped'}]
